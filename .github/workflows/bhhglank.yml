name: Build Chromium Mirror Layout
on:
  workflow_dispatch:

jobs:
  build:
    # WARNING: Standard ubuntu-latest runner will run out of storage.
    # It is highly recommended to change this to 'self-hosted'.
    runs-on: ubuntu-latest 

    steps:
      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          df -h

      # Do NOT use actions/checkout@v4 here if this is a full fork. 
      # Instead, we pull depot_tools and map the existing workspace directory.
      - name: Pull Google depot_tools
        run: |
          git clone https://googlesource.com ${{ github.workspace }}/depot_tools
          echo "${{ github.workspace }}/depot_tools" >> $GITHUB_PATH

      - name: Initialize Gclient Environment Configuration
        run: |
          export PATH=$PATH:${{ github.workspace }}/depot_tools
          
          # Move up one directory level to create the workspace container
          cd ${{ github.workspace }}/..
          
          # Generate the system .gclient file pointing directly to your repository folder
          cat <<EOF > .gclient
          solutions = [
            {
              "name": "${{ github.event.repository.name }}",
              "url": "https://github.com{{ github.repository }}.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          EOF

      - name: Bind Dependencies and Install Prerequisites
        run: |
          export PATH=$PATH:${{ github.workspace }}/depot_tools
          # In the official GitHub mirror layout, the workspace root contains the automated linux script
          cd ${{ github.workspace }}
          sudo ./build/install-build-deps.sh --no-prompt
          
          # Pull down external binaries specified by the DEPS config file
          gclient runhooks

      - name: Construct Compilation Files
        run: |
          export PATH=$PATH:${{ github.workspace }}/depot_tools
          cd ${{ github.workspace }}
          mkdir -p out/Release
          
          # Critical compilation args tailored to lower memory footprint 
          cat <<EOF > out/Release/args.gn
          is_debug = false
          symbol_level = 0
          blink_symbol_level = 0
          target_cpu = "x64"
          is_component_build = true
          disable_fieldtrial_testing_config = true
          EOF
          
          gn gen out/Release

      - name: Build Target
        run: |
          export PATH=$PATH:${{ github.workspace }}/depot_tools
          cd ${{ github.workspace }}
          # Safest lightweight validation target
          autoninja -C out/Release mini_chromium

      - name: Store Binaries
        uses: actions/upload-artifact@v4
        with:
          name: chromium-github-mirror-binaries
          path: ${{ github.workspace }}/out/Release/
